name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Actions are pinned to full commit SHAs (tags can move); upgrade deliberately and update the version comment.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id stays `process` so a branch rule requiring this check keeps matching.
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Installs exactly the version go.mod pins; the harness then runs it with GOTOOLCHAIN=local.
      # Module caching stays off until the module has dependencies (there is no go.sum to key it on yet).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Process and Go checks (docs, adapters, harness tests, gofmt, vet, race tests)
        run: python3 .agents/scripts/harness.py check ci

      - name: Go vulnerability scan (govulncheck at the harness's pinned version)
        run: python3 .agents/scripts/harness.py check vuln
