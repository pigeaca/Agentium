<text x="16" y="320"><tspan fill="#767676">│</tspan>&#160;this&#160;size&#160;can&#160;see&#160;&#160;&#160;&#160;25%&#160;less&#160;cost,&#160;or&#160;33%&#160;more&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="339"><tspan fill="#767676">│</tspan>&#160;expected&#160;from&#160;size&#160;&#160;&#160;about&#160;4%&#160;less:&#160;the&#160;context&#160;is&#160;4,634&#160;tokens&#160;smaller&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="358"><tspan fill="#767676">│</tspan>&#160;likely&#160;result&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#ffd700">not&#160;sure</tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="377"><tspan fill="#767676">│</tspan>&#160;<tspan fill="#767676">seeing&#160;4%&#160;would&#160;take&#160;about&#160;820&#160;runs&#160;·&#160;size&#160;is&#160;not&#160;everything:&#160;a&#160;context&#160;that&#160;changes&#160;what&#160;the</tspan>&#160;&#160;&#160;&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="396"><tspan fill="#767676">│</tspan>&#160;<tspan fill="#767676">agent&#160;does&#160;can&#160;move&#160;cost&#160;more</tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="415"><tspan fill="#767676">╰──────────────────────────────────────────────────────────────────────────────────────────────────╯</tspan></text>
