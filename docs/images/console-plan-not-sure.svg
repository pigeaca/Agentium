<text x="16" y="206"><tspan fill="#767676">│</tspan>&#160;<tspan fill="#ffd700">!</tspan>&#160;the&#160;budget&#160;$17.00&#160;is&#160;below&#160;the&#160;estimated&#160;$19.43&#160;plus&#160;$6.60&#160;held&#160;for&#160;runs&#160;in&#160;flight:&#160;expect&#160;it&#160;&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="225"><tspan fill="#767676">│</tspan>&#160;&#160;&#160;to&#160;stop&#160;the&#160;experiment&#160;early&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#767676">│</tspan></text>
