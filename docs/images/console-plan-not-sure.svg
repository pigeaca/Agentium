<text x="16" y="92">&#160;<tspan fill="#767676">───────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
<text x="16" y="111">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#767676">ab16&#160;·&#160;8&#160;tasks&#160;·&#160;16&#160;runs&#160;·&#160;sonnet-5&#160;·&#160;2&#160;at&#160;a&#160;time</tspan></text>
<text x="16" y="130"></text>
<text x="16" y="149"><tspan fill="#767676">╭─</tspan>&#160;<tspan font-weight="bold">before&#160;it&#160;runs</tspan>&#160;<tspan fill="#767676">─────────────────────────────────────────────────────────────────────────────────</tspan><tspan fill="#767676">╮</tspan></text>
<text x="16" y="168"><tspan fill="#767676">│</tspan>&#160;<tspan fill="#ffd700">!</tspan>&#160;validated&#160;with&#160;fewer&#160;than&#160;3&#160;repeats,&#160;so&#160;flaky&#160;checks&#160;may&#160;not&#160;show&#160;yet:&#160;active-config-files,&#160;&#160;&#160;&#160;<tspan fill="#767676">│</tspan></text>
