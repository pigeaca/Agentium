<text x="16" y="472"><tspan fill="#767676">│</tspan>&#160;likely&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#ff5f5f">████████████████████████████████████████▎</tspan><tspan fill="#767676">░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░</tspan>&#160;&#160;&#160;$19.43&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="491"><tspan fill="#767676">│</tspan>&#160;worst&#160;case&#160;&#160;&#160;&#160;<tspan fill="#ff5f5f">█████████████████████████████████████████████████████████████████████████</tspan>&#160;&#160;&#160;$35.20&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="510"><tspan fill="#767676">│</tspan>&#160;budget&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#8a8a8a">███████████████████████████████████▎</tspan><tspan fill="#767676">░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░</tspan>&#160;&#160;&#160;&#160;&#160;&#160;$17&#160;<tspan fill="#767676">│</tspan></text>
