<text x="16" y="548"></text>
<text x="16" y="567"><tspan fill="#8b8b8b">●&#160;success,&#160;○&#160;failure,&#160;×&#160;not&#160;counted;&#160;cost&#160;is&#160;the&#160;mean&#160;of&#160;counted&#160;runs.</tspan></text>
<text x="16" y="586"></text>
