<text x="16" y="73">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#5fafff" font-weight="bold">BASELINE</tspan><tspan fill="#767676">&#160;&#160;vs&#160;&#160;</tspan><tspan fill="#ffaf5f" font-weight="bold">LEAN</tspan><tspan fill="#767676">&#160;&#160;&#160;·&#160;&#160;&#160;</tspan>does&#160;lean&#160;save&#160;money?</text>
