<text x="523" y="23" fill="#8b8b8b" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">agentium experiment report opus-vs-sonnet</text>
<g font-family="SF Mono, Menlo, Consolas, DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" fill="#d4d4d4">
<text x="16" y="54"><tspan fill="#29b8db">$</tspan>&#160;agentium&#160;experiment&#160;report&#160;opus-vs-sonnet</text>
<text x="16" y="73"><tspan font-weight="bold">Experiment&#160;opus-vs-sonnet</tspan></text>
<text x="16" y="92"></text>
<text x="16" y="111">Model&#160;A/B&#160;on&#160;context&#160;base:&#160;A&#160;=&#160;claude-opus-5-5,&#160;B&#160;=&#160;claude-sonnet-5-5.&#160;Goal:&#160;cheaper,&#160;without&#160;losing&#160;success.</text>
<text x="16" y="130"></text>
<text x="16" y="149"><tspan font-weight="bold">B&#160;(claude-sonnet-5-5)&#160;costs&#160;63%&#160;less;&#160;success:&#160;exploratory.</tspan></text>
<text x="16" y="168"></text>
<text x="16" y="187">-&#160;<tspan font-weight="bold">Success:&#160;A&#160;(claude-opus-5-5)&#160;50%&#160;→&#160;B&#160;(claude-sonnet-5-5)&#160;75%</tspan>,&#160;Δ&#160;+25&#160;pp&#160;(95%:&#160;-14&#160;to&#160;+64):&#160;<tspan fill="#e5c07b">exploratory:&#160;too&#160;few&#160;task…</tspan></text>
<text x="16" y="206">-&#160;<tspan font-weight="bold">Cost&#160;of&#160;B&#160;(claude-sonnet-5-5)&#160;vs&#160;A&#160;(claude-opus-5-5)&#160;-63%</tspan>&#160;(95%:&#160;-70%&#160;to&#160;-53%):&#160;<tspan fill="#23d18b">improved</tspan>.</text>
<text x="16" y="225"></text>
<text x="16" y="244">16&#160;of&#160;16&#160;runs&#160;settled&#160;(<tspan fill="#23d18b">done</tspan>);&#160;spent&#160;$3.10&#160;of&#160;$54.00.&#160;8&#160;task(s)&#160;×&#160;1&#160;run(s)&#160;per&#160;arm;&#160;A&#160;claude-opus-5-5,&#160;B&#160;claude-sonnet…</text>
<text x="16" y="263"></text>
<text x="16" y="282">First&#160;decisive&#160;verdict:&#160;improved&#160;on&#160;cost&#160;in&#160;opus-vs-sonnet,&#160;1h&#160;5m&#160;after&#160;init,&#160;$3.34&#160;spent&#160;up&#160;to&#160;it.</text>
<text x="16" y="301"></text>
<text x="16" y="320"><tspan font-weight="bold">Metrics</tspan></text>
<text x="16" y="339"></text>
<text x="16" y="358"><tspan fill="#8b8b8b">A&#160;and&#160;B:&#160;the&#160;success&#160;rate,&#160;or&#160;the&#160;geometric&#160;mean&#160;per&#160;run.&#160;B&#160;vs&#160;A&#160;is&#160;paired&#160;by&#160;task:&#160;a&#160;difference&#160;for&#160;success,&#160;a&#160;ratio…</tspan></text>
<text x="16" y="377"></text>
<text x="16" y="396"><tspan font-weight="bold">Metric</tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan font-weight="bold">Role</tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan font-weight="bold">A&#160;(claude-opus-5-5)</tspan>&#160;&#160;<tspan font-weight="bold">B&#160;(claude-sonnet-5-5)</tspan>&#160;&#160;<tspan font-weight="bold">B&#160;vs&#160;A</tspan>&#160;&#160;<tspan font-weight="bold">95%&#160;bootstrap</tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan font-weight="bold">95%&#160;t</tspan>&#160;&#160;<tspan font-weight="bold">Verdict</tspan></text>
<text x="16" y="415">Success&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;guard&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;50%&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;75%&#160;&#160;+25&#160;pp&#160;&#160;&#160;[+0,&#160;+62]&#160;pp&#160;&#160;[-14,&#160;+64]&#160;pp&#160;&#160;<tspan fill="#e5c07b">explorato…</tspan></text>
<text x="16" y="434">Cost&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;primary&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;$0.269&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;$0.101&#160;&#160;&#160;&#160;-63%&#160;&#160;&#160;[-68%,&#160;-56%]&#160;&#160;&#160;[-70%,&#160;-53%]&#160;&#160;<tspan fill="#23d18b">improved</tspan></text>
