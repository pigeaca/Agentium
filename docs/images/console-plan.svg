<text x="446" y="23" fill="#8b8b8b" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">agentium experiment plan lean-vs-base</text>
<g font-family="SF Mono, Menlo, Consolas, DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" fill="#d4d4d4">
<text x="16" y="54"><tspan fill="#29b8db">$</tspan>&#160;agentium&#160;experiment&#160;plan&#160;lean-vs-base</text>
<text x="16" y="73">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#5fafff" font-weight="bold">BASELINE</tspan><tspan fill="#767676">&#160;&#160;vs&#160;&#160;</tspan><tspan fill="#ffaf5f" font-weight="bold">LEAN</tspan><tspan fill="#767676">&#160;&#160;&#160;·&#160;&#160;&#160;</tspan>does&#160;lean&#160;save&#160;money?</text>
<text x="16" y="92">&#160;<tspan fill="#767676">───────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
<text x="16" y="111">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#767676">lean-vs-base&#160;·&#160;16&#160;tasks&#160;·&#160;32&#160;runs&#160;·&#160;sonnet-5-5&#160;·&#160;2&#160;at&#160;a&#160;time</tspan></text>
<text x="16" y="130"></text>
<text x="16" y="149"><tspan fill="#767676">╭─</tspan>&#160;<tspan font-weight="bold">before&#160;it&#160;runs</tspan>&#160;<tspan fill="#767676">─────────────────────────────────────────────────────────────────────────────────</tspan><tspan fill="#767676">╮</tspan></text>
<text x="16" y="168"><tspan fill="#767676">│</tspan>&#160;<tspan fill="#ffd700">!</tspan>&#160;validated&#160;with&#160;fewer&#160;than&#160;3&#160;repeats,&#160;so&#160;flaky&#160;checks&#160;may&#160;not&#160;show&#160;yet:&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="187"><tspan fill="#767676">│</tspan>&#160;&#160;&#160;add-f1-to-the-library-8bc741a,&#160;add-f10-to-the-library-504b6c9,&#160;add-f11-to-the-library-00b6050…&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="206"><tspan fill="#767676">│</tspan>&#160;<tspan fill="#767676">✓&#160;5&#160;checks&#160;ok</tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="225"><tspan fill="#767676">╰──────────────────────────────────────────────────────────────────────────────────────────────────╯</tspan></text>
<text x="16" y="244"></text>
<text x="16" y="263"><tspan fill="#767676">╭─</tspan>&#160;<tspan font-weight="bold">can&#160;it&#160;answer?</tspan>&#160;<tspan fill="#767676">─────────────────────────────────────────────────────────────────────────────────</tspan><tspan fill="#767676">╮</tspan></text>
<text x="16" y="282"><tspan fill="#767676">│</tspan>&#160;this&#160;size&#160;can&#160;see&#160;&#160;&#160;&#160;19%&#160;less&#160;cost,&#160;or&#160;24%&#160;more&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="301"><tspan fill="#767676">╰──────────────────────────────────────────────────────────────────────────────────────────────────╯</tspan></text>
<text x="16" y="320"></text>
<text x="16" y="339"><tspan fill="#767676">╭─</tspan>&#160;<tspan font-weight="bold">what&#160;it&#160;may&#160;spend</tspan>&#160;<tspan fill="#767676">──────────────────────────────────────────────────────────────────────────────</tspan><tspan fill="#767676">╮</tspan></text>
<text x="16" y="358"><tspan fill="#767676">│</tspan>&#160;likely&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#87d787">████████████████████████████████▍</tspan><tspan fill="#767676">░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░</tspan>&#160;&#160;&#160;$33.22&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="377"><tspan fill="#767676">│</tspan>&#160;all&#160;tasks&#160;run&#160;<tspan fill="#87d787">██████████████████████████████████████████████████▎</tspan><tspan fill="#767676">░░░░░░░░░░░░░░░░░░░░░░</tspan>&#160;&#160;&#160;$51.58&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="396"><tspan fill="#767676">│</tspan>&#160;budget&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#8a8a8a">█████████████████████████████████████████████████████████████████████████</tspan>&#160;&#160;&#160;&#160;&#160;&#160;$75&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="415"><tspan fill="#767676">│</tspan>&#160;<tspan fill="#767676">likely:&#160;if&#160;nothing&#160;changes,&#160;about&#160;10.3&#160;of&#160;16&#160;tasks&#160;are&#160;used</tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="434"><tspan fill="#767676">│</tspan>&#160;<tspan fill="#767676">if&#160;every&#160;run&#160;hit&#160;its&#160;cap:&#160;$105.60</tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="453"><tspan fill="#767676">╰──────────────────────────────────────────────────────────────────────────────────────────────────╯</tspan></text>
<text x="16" y="472"></text>
<text x="16" y="491"><tspan fill="#767676">╭─</tspan>&#160;<tspan font-weight="bold">when&#160;it&#160;checks&#160;the&#160;answer</tspan>&#160;<tspan fill="#767676">──────────────────────────────────────────────────────────────────────</tspan><tspan fill="#767676">╮</tspan></text>
<text x="16" y="510"><tspan fill="#767676">│</tspan>&#160;check&#160;1:&#160;8&#160;tasks&#160;&#160;&#160;<tspan fill="#87d787">██████████████████████████████████</tspan><tspan fill="#767676">░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░</tspan>&#160;&#160;&#160;$25.79&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="529"><tspan fill="#767676">│</tspan>&#160;check&#160;2:&#160;12&#160;tasks&#160;&#160;<tspan fill="#87d787">███████████████████████████████████████████████████</tspan><tspan fill="#767676">░░░░░░░░░░░░░░░░░</tspan>&#160;&#160;&#160;$38.69&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="548"><tspan fill="#767676">│</tspan>&#160;check&#160;3:&#160;16&#160;tasks&#160;&#160;<tspan fill="#87d787">████████████████████████████████████████████████████████████████████</tspan>&#160;&#160;&#160;$51.58&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="567"><tspan fill="#767676">│</tspan>&#160;<tspan fill="#767676">it&#160;stops&#160;at&#160;the&#160;first&#160;check&#160;with&#160;a&#160;clear&#160;answer</tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#767676">│</tspan></text>
<text x="16" y="586"><tspan fill="#767676">╰──────────────────────────────────────────────────────────────────────────────────────────────────╯</tspan></text>
<text x="16" y="605"></text>
<text x="16" y="624">&#160;<tspan fill="#767676">on&#160;your&#160;plan:&#160;32&#160;runs&#160;need&#160;about&#160;2.3&#160;windows&#160;of&#160;the&#160;five-hour&#160;limit</tspan></text>
<text x="16" y="643">&#160;<tspan fill="#767676">everything:&#160;agentium&#160;experiment&#160;plan&#160;lean-vs-base&#160;--details</tspan></text>
